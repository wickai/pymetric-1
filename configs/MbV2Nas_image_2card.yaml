MODEL:
  TYPE: mobilenetv2_nas
  NUM_CLASSES: 1000
  OP_CODES: [15, 6, 15, 7, 7, 7, 13, 14, 15, 1, 10, 15, 13, 7, 15, 14, 8, 5, 7, 13, 6]
  WIDTH_CODES: [0, 0, 0, 0, 0, 0, 0]
  HEADS:
    NAME: "LinearHead"
    NUM_CLASSES: 1000
    IN_FEAT: 1280
    REDUCTION_DIM: 960
    POOL_LAYER: "avgpool"
    CLS_LAYER: "linear"
    MARGIN: 0.1
    SCALE: 30
  LOSSES:
    LABEL_SMOOTHING: 0.1
BN:
  ZERO_INIT_FINAL_GAMMA: True
OPTIM:
  BASE_LR: 0.08
  LR_POLICY: cos
  STEPS: [0, 30, 60, 90]
  LR_MULT: 0.1
  MAX_EPOCH: 300
  MOMENTUM: 0.9
  NESTEROV: True
  WEIGHT_DECAY: 0.00001
  WARMUP_EPOCHS: 0
TRAIN:
  DATASET: imagenet
  SPLIT: train
  BATCH_SIZE: 256
  IM_SIZE: 224
  CHECKPOINT_PERIOD: 1
  EVAL_PERIOD: 1
  EMA_FLAG: True
TEST:
  DATASET: imagenet
  SPLIT: validation
  BATCH_SIZE: 128
  IM_SIZE: 256
NUM_GPUS: 2
DATA_LOADER:
  NUM_WORKERS: 16
  MIXUP_ALPHA: 0.2
  CUTMIX_ALPHA: 0.2
CUDNN:
  BENCHMARK: True
OUT_DIR: .
LOG_DEST: file
